<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15181b">
  <title>Izh Car — уличные гонки по Ижевску</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; }
    html.nohud body > :not(canvas:first-child) { display: none !important; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #15181b; font-size: 20px; z-index: 19; }
    #loading { transition: opacity .6s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .box { width: min(86vw, 480px); text-align: center; }
    #loading h1 { margin: 0 0 22px; }
    #loading h1 img { display: block; width: 100%; animation: logo-in .7s cubic-bezier(.2,.8,.3,1.2) both; }
    #loading h1 small { display: block; margin-top: 10px; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
    @keyframes logo-in { from { opacity: 0; transform: scale(.85) skewX(-8deg); } }
    #loading-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
    #loading-fill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #ff8a2a, #ffd23f); transition: width .2s; }
    #loading-text { margin-top: 12px; font-size: 15px; opacity: .75; min-height: 1.4em; }
    /* Экран «Поехали» на месте полосы загрузки (main.js: startScreen). */
    #start { display: flex; flex-direction: column; gap: 14px; animation: logo-in .4s ease-out both; }
    #start[hidden], #start label[hidden] { display: none; }
    #start label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; text-align: left; }
    #start label small { font-weight: 400; font-size: 12px; opacity: .6; }
    #start input { font: inherit; font-size: 19px; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.3);
      border-radius: 10px; padding: 10px 14px; outline: none; }
    #start input:focus { border-color: #ffd23f; }
    #start button { font: inherit; font-size: 22px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .04em;
      color: #15181b; background: #ffd23f; border: 0; border-radius: 12px; padding: 12px; cursor: pointer; }
    #start button:hover { background: #ffdc5c; }
    #start button kbd { margin-left: 10px; font-family: inherit; font-size: 12px; font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0;
      border: 1px solid rgba(0,0,0,.3); border-radius: 4px; padding: 0 5px; opacity: .6; vertical-align: middle; }
    body.touch #start button kbd { display: none; }
    body.touch #loading h1 { margin-bottom: 12px; }
    body.touch #loading .box { width: min(70vw, 420px); }
    #loading.error #loading-fill { background: #ff3b30; }
    #loading.error #loading-text { color: #ff9d8a; opacity: 1; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #speedo { right: 28px; bottom: 24px; text-align: right; }
    #speed { font-size: 72px; font-weight: 800; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; }
    #speedo .unit { font-size: 16px; opacity: .8; }
    #nitro { width: 180px; height: 8px; margin-top: 8px; margin-left: auto; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    #nitro-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2fa8ff, #9ef0ff); }
    #nitro.locked #nitro-fill { background: #5d6b78; }
    #fuel { position: relative; width: 180px; height: 8px; margin-top: 6px; margin-left: auto; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    #fuel::before { content: '⛽'; position: absolute; left: -22px; top: -5px; font-size: 13px; }
    #fuel { overflow: visible; }
    #fuel-fill { height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #ff8a2a, #ffd23f); }
    #fuel.low #fuel-fill { background: #ff3b30; animation: blink .6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    #fuelhint { left: 50%; top: 96px; transform: translateX(-50%); font-size: 17px; font-weight: 700; color: #fff; background: rgba(214,110,20,.85);
      padding: 4px 14px; border-radius: 8px; }
    #fuelhint:empty { display: none; }
    #fuelhint.crit { background: rgba(210,40,30,.92); animation: pulse .8s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.08); } }
    #fuelwarn { left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; font-style: italic; text-align: center;
      color: #ff9d2e; opacity: 0; transition: opacity .25s; }
    #fuelwarn.show { opacity: 1; }
    #fuelwarn.crit { color: #ff4433; }
    #fuelwarn small { display: block; font-size: 18px; font-weight: 700; font-style: normal; color: #fff; margin-top: 4px; }
    #radio { right: 28px; bottom: 140px; font-size: 15px; font-weight: 600; color: #fff; background: rgba(0,0,0,.35);
      padding: 3px 12px; border-radius: 6px; white-space: nowrap; opacity: .9; z-index: 3; pointer-events: auto; cursor: pointer; user-select: none; }
    #radio:hover { background: rgba(0,0,0,.55); }
    #radio:empty { display: none; }
    #radio.off { font-size: 12px; padding: 2px 8px; opacity: .55; }
    #radio.error { color: #ff9d8a; }
    #radio.flash { animation: radio-flash 1.2s ease-out; }
    @keyframes radio-flash { 0% { background: rgba(255,210,63,.85); color: #15181b; } }
    body.in-garage #radio { display: none; }
    #lowfuel { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0;
      box-shadow: inset 0 0 160px 50px rgba(255,70,20,.7); }
    body.fuel-crit #lowfuel { animation: vignette 1.2s ease-in-out infinite; }
    @keyframes vignette { 50% { opacity: 1; } }
    #fuelptr { position: fixed; z-index: 2; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; pointer-events: none; display: none;
      background: #e07a1f; border: 2px solid rgba(255,255,255,.9); box-sizing: border-box; font: 15px/24px sans-serif; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    #race { left: 24px; top: 20px; font-size: 18px; line-height: 1.5; }
    #race b { font-size: 34px; font-variant-numeric: tabular-nums; }
    #race .lbl { opacity: .7; font-size: 14px; margin-right: 6px; }
    #street { left: 50%; top: 18px; transform: translateX(-50%); font-size: 20px; font-weight: 600; background: rgba(0,0,0,.35); padding: 4px 14px; border-radius: 6px; }
    #street:empty { display: none; }
    #landmark { left: 50%; top: 58px; transform: translateX(-50%); font-size: 15px; color: #ffe08a; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 6px; }
    #landmark:empty { display: none; }
    #landmark::before { content: '★ '; }
    #banner { left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; font-style: italic; opacity: 0; transition: opacity .2s; text-align: center; color: #ffd23f; }
    #banner.show { opacity: 1; }
    #banner.mini { top: 96px; transform: translate(-50%, 0); font-size: 30px; }
    #banner.mini small { font-size: 14px; margin-top: 2px; }
    #banner { transition: opacity .2s, top .6s ease, transform .6s ease, font-size .6s ease; }
    #banner small { display: block; font-size: 20px; font-weight: 600; color: #fff; font-style: normal; margin-top: 6px; }
    #minimap { position: fixed; left: 24px; bottom: 24px; width: 220px; height: 220px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
    #minimap.big { width: 420px; height: 420px; }
    #north { position: fixed; z-index: 2; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none;
      background: #c62d2d; border: 2px solid rgba(255,255,255,.9); box-sizing: border-box; color: #fff; font: 700 14px/22px sans-serif;
      text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    body.in-garage #north { display: none; }
    #menu-btn { position: fixed; right: 24px; top: 20px; font: inherit; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 6px 12px; }
    #menu-btn:hover { background: rgba(0,0,0,.55); }
    #menu-btn kbd, #menu kbd { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 5px; font-family: inherit;
      font-size: 12px; font-weight: 600; }
    #menu-btn kbd { margin-left: 6px; opacity: .7; }
    body.in-garage #menu-btn, body.in-menu #menu-btn { display: none; }
    /* Пока гонки нет — вместо таймера кнопка «Гонка» на его месте. */
    #race-btn { position: fixed; left: 24px; top: 20px; font: inherit; font-size: 17px; font-weight: 700; color: #fff; cursor: pointer;
      background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 8px 14px; display: none; }
    #race-btn:hover { background: rgba(0,0,0,.55); }
    #race-btn kbd { margin-left: 8px; opacity: .7; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.3); border-radius: 4px;
      padding: 0 5px; font-family: inherit; font-size: 12px; font-weight: 600; }
    body.no-race #race { display: none; }
    /* Игроки в комнате; в общей гонке — места. Справа под кнопкой меню. */
    #roster { right: 24px; top: 64px; min-width: 170px; max-width: 240px; font-size: 15px; background: rgba(0,0,0,.35); border-radius: 8px; padding: 6px 10px; }
    #roster[hidden] { display: none; }
    #roster h4 { margin: 0 0 3px; font-size: 12px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
    #roster div { display: flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.6; }
    #roster div.me { font-weight: 700; }
    #roster span { min-width: 1.4em; opacity: .8; font-variant-numeric: tabular-nums; }
    #roster i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); flex: none; }
    #roster em { margin-left: auto; padding-left: 10px; font-style: normal; opacity: .75; font-size: 13px; font-variant-numeric: tabular-nums; }
    body.in-garage #roster, body.in-menu #roster { display: none; }
    body.no-race #race-btn { display: block; }
    body.in-garage #race-btn, body.in-menu #race-btn { display: none; }
    #attr { position: fixed; right: 8px; bottom: 4px; font-size: 11px; opacity: .7; }
    #attr a { color: inherit; }

    /* ---------- гараж ---------- */
    #garage { position: fixed; right: 0; top: 0; bottom: 0; width: min(46vw, 420px); z-index: 15; display: none; flex-direction: column;
      background: rgba(16,19,22,.86); backdrop-filter: blur(6px); padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
      padding-right: calc(16px + env(safe-area-inset-right)); box-sizing: border-box; }
    #garage.open { display: flex; }
    #garage h2 { margin: 0 0 12px; font-size: 24px; font-style: italic; }
    #garage h2 span { display: block; font-size: 13px; font-style: normal; font-weight: 400; opacity: .6; margin-top: 2px; }
    #garage .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #garage .card { text-align: left; color: #fff; font: inherit; background: rgba(255,255,255,.06); border: 2px solid transparent;
      border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    #garage .card.on { border-color: #ffd23f; background: rgba(255,210,63,.1); }
    #garage .card b { font-size: 16px; }
    #garage .card small { margin-left: 8px; opacity: .6; }
    #garage .card p { margin: 4px 0 8px; font-size: 12.5px; opacity: .75; line-height: 1.35; }
    #garage .card p.credit { margin-top: -4px; font-size: 10.5px; opacity: .5; }
    #garage .stat { display: flex; align-items: center; gap: 8px; font-size: 11px; opacity: .85; margin-top: 3px; }
    #garage .stat span { width: 68px; }
    #garage .stat i { flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #ffd23f var(--v), rgba(255,255,255,.12) var(--v)); }
    #garage .colors { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    #garage .colors button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
    #garage .colors button.on { border-color: #fff; box-shadow: 0 0 0 2px #ffd23f; }
    #garage .go { font: inherit; font-weight: 800; font-size: 18px; padding: 10px; border-radius: 10px; border: 0; background: #ffd23f;
      color: #15181b; cursor: pointer; }
    #garage .go kbd { font-size: 11px; font-weight: 600; opacity: .6; margin-left: 6px; }
    #garage .hint { font-size: 11px; opacity: .55; margin-top: 8px; text-align: center; }
    body.touch #garage .hint, body.touch #garage .go kbd { display: none; }
    body.in-garage #touch, body.in-garage #speedo, body.in-garage #minimap { display: none; }
    body.touch #garage { padding-top: calc(10px + env(safe-area-inset-top)); }
    body.touch #garage h2 { font-size: 18px; margin-bottom: 8px; }
    body.touch #garage .card p { display: none; }

    /* ---------- меню-пауза (menu.js) ---------- */
    #menu { position: fixed; inset: 0; z-index: 16; display: none; place-items: center; background: rgba(10,12,14,.55); backdrop-filter: blur(4px); }
    #menu.open { display: grid; }
    #menu .box { width: min(92vw, 380px); max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column;
      gap: 6px; padding: 18px 16px; border-radius: 14px; background: rgba(16,19,22,.92); }
    #menu h2 { margin: 0 0 6px; font-size: 26px; font-style: italic; }
    #menu h3 { margin: 10px 0 2px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .55; }
    #menu button { display: flex; align-items: center; gap: 8px; text-align: left; font: inherit; font-size: 15px; color: #fff; cursor: pointer;
      background: rgba(255,255,255,.06); border: 0; border-radius: 9px; padding: 10px 12px; }
    #menu button:hover { background: rgba(255,255,255,.12); }
    #menu button b { margin-left: auto; color: #ffd23f; font-weight: 700; }
    #menu button b.off { color: rgba(255,255,255,.45); }
    #menu button kbd { margin-left: auto; opacity: .6; }
    #menu button b ~ kbd { margin-left: 0; }
    #menu .go { font-weight: 800; font-size: 17px; background: #ffd23f; color: #15181b; }
    #menu .go:hover { background: #ffdc5c; }
    #menu .go kbd { color: #15181b; border-color: rgba(0,0,0,.3); background: rgba(0,0,0,.08); }
    #menu .page { display: flex; flex-direction: column; gap: 6px; }
    #menu .page[hidden] { display: none; }
    #menu button[hidden] { display: none; }
    #menu h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
    #menu input[data-name] { font: inherit; font-size: 17px; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3);
      border-radius: 9px; padding: 10px 12px; outline: none; }
    #menu input[data-name]:focus { border-color: #ffd23f; }
    #menu .hint { margin: 2px 2px 6px; font-size: 13px; opacity: .65; }
    #menu button i { font-style: normal; font-size: 20px; line-height: 1; opacity: .6; }
    #menu .volumes { display: flex; flex-direction: column; gap: 4px; padding: 6px 12px 8px; border-radius: 9px; background: rgba(255,255,255,.06); }
    #menu .volumes.off { opacity: .45; }
    #menu .volumes label { display: grid; grid-template-columns: 105px 1fr 42px; align-items: center; gap: 8px; font-size: 14px; }
    #menu .volumes input { width: 100%; min-width: 0; margin: 0; height: 28px; accent-color: #ffd23f; cursor: pointer; }
    #menu .volumes output { text-align: right; color: #ffd23f; font-weight: 700; font-variant-numeric: tabular-nums; }
    /* Барабан станций (wheel.js): строки по --row, выбранная — в полосе посередине; --pad — пустое место над первой строкой. */
    .wheel-box { position: relative; border-radius: 9px; background: rgba(255,255,255,.06); }
    .wheel-box::before { content: ''; position: absolute; left: 6px; right: 6px; top: var(--pad); height: var(--row); border-radius: 8px;
      background: rgba(255,255,255,.12); pointer-events: none; }
    .wheel { position: relative; height: calc(var(--pad) * 2 + var(--row)); overflow-y: scroll; scroll-snap-type: y mandatory;
      overscroll-behavior: contain; scrollbar-width: none; perspective: 500px; outline: none; touch-action: pan-y;
      mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel::before, .wheel::after { content: ''; display: block; height: var(--pad); }
    .wheel div { height: var(--row); line-height: var(--row); padding: 0 14px; text-align: center; font-size: 18px; white-space: nowrap;
      scroll-snap-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .wheel div.on { color: #ffd23f; font-weight: 700; }
    /* Тот же барабан на игровом экране — по нажатию на надпись радио, игра не встаёт. */
    #radio-pick { position: fixed; z-index: 4; display: none; color: #fff; font-weight: 600; background: rgba(10,12,14,.72);
      backdrop-filter: blur(4px); border-radius: 10px; }
    #radio-pick.open { display: block; }
    #radio-pick .wheel div { font-size: 16px; }
    body.in-garage #radio-pick, body.in-menu #radio-pick { display: none; }
    #menu .keys { margin-top: 10px; font-size: 12.5px; line-height: 1.8; opacity: .7; }
    #menu .tricks { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-radius: 9px; background: rgba(255,255,255,.06);
      font-size: 14px; line-height: 1.45; }
    #menu .tricks b { color: #ffd23f; }
    #menu .tricks .combo { display: block; margin-top: 4px; font-weight: 600; }
    body.touch #menu .only-keys, body:not(.touch) #menu .only-touch { display: none; }
    body.touch #menu kbd, body.touch #menu .keys { display: none; }
    body.touch #menu .box { padding: calc(10px + env(safe-area-inset-top)) 14px 12px; gap: 4px; }
    body.touch #menu .page { gap: 4px; }
    body.touch #menu button { padding: 8px 12px; }
    body.touch #menu h2 { font-size: 20px; }

    /* ---------- сенсорное управление (body.touch ставит touch.js) ---------- */
    body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body.touch #menu-btn { display: none; }
    body.in-menu #touch, body.in-menu #north, body.in-menu #fuelptr { display: none; }
    #touch button { font-family: inherit; color: #fff; border: 2px solid rgba(255,255,255,.55); background: rgba(20,24,28,.38);
      -webkit-tap-highlight-color: transparent; touch-action: none; }
    #steer-zone { position: fixed; left: 0; bottom: 0; width: 45vw; height: 62vh; touch-action: none; }
    #steer-zone > span { position: absolute; left: calc(40px + env(safe-area-inset-left)); bottom: 26px; font-size: 13px; opacity: .55; }
    #steer-base { position: absolute; left: calc(110px + env(safe-area-inset-left)); top: 62%; width: 120px; height: 52px; margin: -26px 0 0 -60px;
      border-radius: 26px; border: 2px solid rgba(255,255,255,.4); background: rgba(20,24,28,.25); }
    #steer-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
      background: rgba(255,255,255,.55); }
    #steer-zone.on #steer-base { border-color: rgba(255,255,255,.75); }
    #pedals { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: 14px; display: grid;
      grid-template-columns: 84px 96px; grid-template-rows: 56px 110px; gap: 10px; }
    .pedal { border-radius: 16px; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    .pedal.small { font-size: 12px; border-radius: 14px; }
    .pedal.gas { background: rgba(40,160,80,.42); }
    .pedal.brake { background: rgba(200,60,50,.38); }
    .pedal.nitro { background: rgba(47,168,255,.38); }
    .pedal.on { filter: brightness(1.8); transform: scale(.96); }
    #tbar { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 6px; }
    #tbar button { width: 40px; height: 40px; border-radius: 10px; font-size: 18px; padding: 0; }
    /* Миникарта — слева сверху; таймер, улица и подсказки — правее неё. */
    body.touch #minimap { left: calc(12px + env(safe-area-inset-left)); right: auto; top: calc(10px + env(safe-area-inset-top)); bottom: auto;
      width: 118px; height: 118px; }
    body.touch #minimap.big { width: min(300px, 70vh); height: min(300px, 70vh); }
    body.touch #speedo { right: auto; left: 50%; transform: translateX(-50%); bottom: 10px; text-align: center; }
    body.touch #speed { font-size: 48px; }
    body.touch #nitro { width: 130px; margin: 6px auto 0; }
    body.touch #fuel { width: 130px; margin: 5px auto 0; }
    body.touch #fuelhint { left: calc(146px + env(safe-area-inset-left)); transform: none; top: calc(112px + env(safe-area-inset-top)); font-size: 12px; }
