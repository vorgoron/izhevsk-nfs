<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15181b">
  <title>Ижевск: уличные гонки</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #15181b; font-size: 20px; z-index: 10; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
    #speedo { right: 28px; bottom: 24px; text-align: right; }
    #speed { font-size: 72px; font-weight: 800; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; }
    #speedo .unit { font-size: 16px; opacity: .8; }
    #nitro { width: 180px; height: 8px; margin-top: 8px; margin-left: auto; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    #nitro-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2fa8ff, #9ef0ff); }
    #nitro.locked #nitro-fill { background: #5d6b78; }
    #fuel { position: relative; width: 180px; height: 8px; margin-top: 6px; margin-left: auto; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    #fuel::before { content: '⛽'; position: absolute; left: -22px; top: -5px; font-size: 13px; }
    #fuel { overflow: visible; }
    #fuel-fill { height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #ff8a2a, #ffd23f); }
    #fuel.low #fuel-fill { background: #ff3b30; animation: blink .6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    #fuelhint { left: 50%; top: 96px; transform: translateX(-50%); font-size: 15px; color: #ffb066; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 6px; }
    #fuelhint:empty { display: none; }
    #race { left: 24px; top: 20px; font-size: 18px; line-height: 1.5; }
    #race b { font-size: 34px; font-variant-numeric: tabular-nums; }
    #race .lbl { opacity: .7; font-size: 14px; margin-right: 6px; }
    #street { left: 50%; top: 18px; transform: translateX(-50%); font-size: 20px; font-weight: 600; background: rgba(0,0,0,.35); padding: 4px 14px; border-radius: 6px; }
    #street:empty { display: none; }
    #landmark { left: 50%; top: 58px; transform: translateX(-50%); font-size: 15px; color: #ffe08a; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 6px; }
    #landmark:empty { display: none; }
    #landmark::before { content: '★ '; }
    #banner { left: 50%; top: 32%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; font-style: italic; opacity: 0; transition: opacity .2s; text-align: center; color: #ffd23f; }
    #banner.show { opacity: 1; }
    #banner small { display: block; font-size: 20px; font-weight: 600; color: #fff; font-style: normal; margin-top: 6px; }
    #minimap { position: fixed; left: 24px; bottom: 24px; width: 220px; height: 220px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
    #minimap.big { width: 420px; height: 420px; }
    #help { right: 24px; top: 20px; font-size: 13px; opacity: .85; text-align: right; line-height: 1.6; }
    #help kbd { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 5px; font-family: inherit; }
    #attr { position: fixed; right: 8px; bottom: 4px; font-size: 11px; opacity: .7; }
    #attr a { color: inherit; }

    /* ---------- гараж ---------- */
    #garage { position: fixed; right: 0; top: 0; bottom: 0; width: min(46vw, 420px); z-index: 15; display: none; flex-direction: column;
      background: rgba(16,19,22,.86); backdrop-filter: blur(6px); padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
      padding-right: calc(16px + env(safe-area-inset-right)); box-sizing: border-box; }
    #garage.open { display: flex; }
    #garage h2 { margin: 0 0 12px; font-size: 24px; font-style: italic; }
    #garage h2 span { display: block; font-size: 13px; font-style: normal; font-weight: 400; opacity: .6; margin-top: 2px; }
    #garage .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #garage .card { text-align: left; color: #fff; font: inherit; background: rgba(255,255,255,.06); border: 2px solid transparent;
      border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    #garage .card.on { border-color: #ffd23f; background: rgba(255,210,63,.1); }
    #garage .card b { font-size: 16px; }
    #garage .card small { margin-left: 8px; opacity: .6; }
    #garage .card p { margin: 4px 0 8px; font-size: 12.5px; opacity: .75; line-height: 1.35; }
    #garage .stat { display: flex; align-items: center; gap: 8px; font-size: 11px; opacity: .85; margin-top: 3px; }
    #garage .stat span { width: 68px; }
    #garage .stat i { flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #ffd23f var(--v), rgba(255,255,255,.12) var(--v)); }
    #garage .colors { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    #garage .colors button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
    #garage .colors button.on { border-color: #fff; box-shadow: 0 0 0 2px #ffd23f; }
    #garage .go { font: inherit; font-weight: 800; font-size: 18px; padding: 10px; border-radius: 10px; border: 0; background: #ffd23f;
      color: #15181b; cursor: pointer; }
    #garage .go kbd { font-size: 11px; font-weight: 600; opacity: .6; margin-left: 6px; }
    #garage .hint { font-size: 11px; opacity: .55; margin-top: 8px; text-align: center; }
    body.touch #garage .hint, body.touch #garage .go kbd { display: none; }
    body.in-garage #touch, body.in-garage #speedo, body.in-garage #minimap { display: none; }
    body.touch #garage { padding-top: calc(10px + env(safe-area-inset-top)); }
    body.touch #garage h2 { font-size: 18px; margin-bottom: 8px; }
    body.touch #garage .card p { display: none; }

    /* ---------- сенсорное управление (body.touch ставит touch.js) ---------- */
    body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body.touch #help { display: none; }
    #touch button { font-family: inherit; color: #fff; border: 2px solid rgba(255,255,255,.55); background: rgba(20,24,28,.38);
      -webkit-tap-highlight-color: transparent; touch-action: none; }
    #steer-zone { position: fixed; left: 0; bottom: 0; width: 45vw; height: 62vh; touch-action: none; }
    #steer-zone > span { position: absolute; left: calc(40px + env(safe-area-inset-left)); bottom: 26px; font-size: 13px; opacity: .55; }
    #steer-base { position: absolute; left: calc(110px + env(safe-area-inset-left)); top: 62%; width: 120px; height: 52px; margin: -26px 0 0 -60px;
      border-radius: 26px; border: 2px solid rgba(255,255,255,.4); background: rgba(20,24,28,.25); }
    #steer-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
      background: rgba(255,255,255,.55); }
    #steer-zone.on #steer-base { border-color: rgba(255,255,255,.75); }
    #pedals { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: 14px; display: grid;
      grid-template-columns: 84px 96px; grid-template-rows: 56px 110px; gap: 10px; }
    .pedal { border-radius: 16px; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    .pedal.small { font-size: 12px; border-radius: 14px; }
    .pedal.gas { background: rgba(40,160,80,.42); }
    .pedal.brake { background: rgba(200,60,50,.38); }
    .pedal.nitro { background: rgba(47,168,255,.38); }
    .pedal.on { filter: brightness(1.8); transform: scale(.96); }
    #tbar { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 6px; }
    #tbar button { width: 40px; height: 40px; border-radius: 10px; font-size: 18px; padding: 0; }
    #tbar button.off { opacity: .45; }
    body.touch #minimap { left: auto; right: calc(12px + env(safe-area-inset-right)); top: calc(58px + env(safe-area-inset-top)); bottom: auto;
      width: 120px; height: 120px; }
    body.touch #minimap.big { width: min(300px, 70vh); height: min(300px, 70vh); }
    body.touch #speedo { right: auto; left: 50%; transform: translateX(-50%); bottom: 10px; text-align: center; }
    body.touch #speed { font-size: 48px; }
    body.touch #nitro { width: 130px; margin: 6px auto 0; }
    body.touch #fuel { width: 130px; margin: 5px auto 0; }
    body.touch #fuelhint { left: calc(14px + env(safe-area-inset-left)); transform: none; top: calc(124px + env(safe-area-inset-top)); font-size: 12px; }
    body.touch #race { left: calc(14px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); font-size: 13px; line-height: 1.35; }
    body.touch #race b { font-size: 24px; }
    /* Улица — слева под таймером: в центре сверху на узком экране мешают кнопки. */
    body.touch #street { left: calc(14px + env(safe-area-inset-left)); transform: none; top: calc(66px + env(safe-area-inset-top));
      font-size: 14px; padding: 3px 10px; max-width: 42vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.touch #landmark { left: calc(14px + env(safe-area-inset-left)); transform: none; top: calc(96px + env(safe-area-inset-top));
      font-size: 12px; max-width: 42vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.touch #banner { font-size: 40px; top: 30%; }
    body.touch #banner small { font-size: 15px; }
    body.touch #attr { font-size: 9px; bottom: 2px; right: auto; left: calc(8px + env(safe-area-inset-left)); }
    #rotate { display: none; }
    @media (orientation: portrait) {
      body.touch #rotate { display: grid; place-items: center; position: fixed; inset: 0; z-index: 20; background: #15181b;
        font-size: 20px; text-align: center; padding: 24px; line-height: 1.5; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="loading"><span id="loading-text">Загрузка…</span></div>
  <div id="street" class="hud"></div>
  <div id="landmark" class="hud"></div>
  <div id="race" class="hud">
    <div><span class="lbl">ВРЕМЯ</span><b id="time">0:00.00</b></div>
    <div><span class="lbl">ЧЕКПОИНТ</span><span id="cp">–</span> · <span id="dist"></span></div>
  </div>
  <div id="help" class="hud">
    <kbd>W A S D</kbd> / стрелки — ехать<br>
    <kbd>Пробел</kbd> ручник/занос · <kbd>Shift</kbd> нитро<br>
    <kbd>R</kbd> на дорогу · <kbd>N</kbd> новая гонка<br>
    <kbd>C</kbd> камера · <kbd>M</kbd> карта · <kbd>V</kbd> звук · <kbd>T</kbd> трафик<br><kbd>G</kbd> гараж — выбор машины
  </div>
  <div id="banner" class="hud"></div>
  <canvas id="minimap" width="440" height="440"></canvas>
  <div id="speedo" class="hud"><span id="speed">0</span> <span class="unit">км/ч</span><div id="nitro"><div id="nitro-fill"></div></div><div id="fuel"><div id="fuel-fill"></div></div></div>
  <div id="fuelhint" class="hud"></div>
  <div id="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">участники OpenStreetMap</a> · рельеф <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">Terrain Tiles</a> (Mapzen, SRTM)</div>
  <div id="rotate"><div><div style="font-size:56px">📱↻</div>Поверните телефон горизонтально</div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
